# nginx — service statique SwarmDrones (likec4.breizh.ai)
#
# Le build LikeC4 utilise --use-hash-history : la navigation est en /#/view,
# donc pas de réécriture d'URL nécessaire. On sert simplement les fichiers.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compression : le bundle likec4-views.js fait ~5 Mo
    gzip on;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/wasm;
    gzip_min_length 1024;
    gzip_comp_level 6;

    # Cache long pour les assets fingerprintés (hash dans le nom)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Pas de cache pour le HTML (le titre/description peuvent changer)
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Fichiers publics (PDF, docx) : cache modéré
    location ~* \.(pdf|docx)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # SPA fallback : tout ce qui n'existe pas renvoie index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 404 personnalisé
    error_page 404 /404.html;
}
